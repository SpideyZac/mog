[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/SpideyZac/mog"

[workspace.lints.rust]
missing_docs = "deny"

[workspace.lints.clippy]
missing_docs_in_private_items = "deny"
absolute_paths = "deny"
doc_markdown = "warn"
missing_panics_doc = "warn"
missing_errors_doc = "warn"
undocumented_unsafe_blocks = "warn"

[workspace.dependencies]
anyhow = "1"
arboard = "3"
clap = { version = "4", features = ["derive"] }
crossterm = { version = "0.29", features = ["event-stream"] }
dirs = "7"
futures = "0.3"
lsp-types = "0.97"
mog-ai = { path = "crates/mog-ai" }
mog-config = { path = "crates/mog-config" }
mog-core = { path = "crates/mog-core" }
mog-flair = { path = "crates/mog-flair" }
mog-lsp = { path = "crates/mog-lsp" }
mog-tui = { path = "crates/mog-tui" }
ratatui = "0.30"
reqwest = { version = "0.13", features = ["json"] }
ropey = "1.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
toml = "1"
toml_edit = "0.25"
unicode-width = "0.2"
