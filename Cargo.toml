[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/SpideyZac/mog"

[workspace.lints.rust]
missing_docs = "deny"

[workspace.lints.clippy]
missing_docs_in_private_items = "deny"
absolute_paths = "deny"
doc_markdown = "warn"
missing_panics_doc = "warn"
missing_errors_doc = "warn"
undocumented_unsafe_blocks = "warn"

[workspace.dependencies]
anyhow = "1"
arboard = "3"
clap = { version = "4", features = ["derive"] }
crossterm = { version = "0.29", features = ["event-stream"] }
dirs = "7"
futures = "0.3"
ignore = "0.4"
lsp-types = "0.97"
mog-ai = { path = "crates/mog-ai" }
mog-config = { path = "crates/mog-config" }
mog-core = { path = "crates/mog-core" }
mog-flair = { path = "crates/mog-flair" }
mog-git = { path = "crates/mog-git" }
mog-lsp = { path = "crates/mog-lsp" }
mog-syntax = { path = "crates/mog-syntax" }
mog-tui = { path = "crates/mog-tui" }
notify = "8"
ratatui = "0.30"
reqwest = { version = "0.13", features = ["json"] }
ropey = "1.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
similar = "3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tree-sitter-bash = "0.25"
tree-sitter-c = "0.24"
tree-sitter-go = "0.25"
tree-sitter-highlight = "0.27"
tree-sitter-javascript = "0.25"
tree-sitter-json = "0.24"
tree-sitter-md = "0.5"
tree-sitter-python = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-toml-ng = "0.7"
tree-sitter-typescript = "0.23"
toml = "1"
toml_edit = "0.25"
unicode-width = "0.2"
