name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --bin mog --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          name="mog-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir "$name"
          cp README.md LICENSE "$name/"
          cp -r examples "$name/"
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp "target/${{ matrix.target }}/release/mog.exe" "$name/"
            7z a "$name.zip" "$name" > /dev/null
            archive="$name.zip"
          else
            cp "target/${{ matrix.target }}/release/mog" "$name/"
            tar czf "$name.tar.gz" "$name"
            archive="$name.tar.gz"
          fi
          if command -v sha256sum > /dev/null; then
            sha256sum "$archive" > "$archive.sha256"
          else
            shasum -a 256 "$archive" > "$archive.sha256"
          fi
          echo "ARCHIVE=$archive" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            ${{ env.ARCHIVE }}
            ${{ env.ARCHIVE }}.sha256

  release:
    needs: build
    # still publish the platforms that built if one of them broke
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # mog shows these in its what's new popup, so list the commits since the last tag
      - name: Write release notes
        shell: bash
        run: |
          previous=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          range="${previous:+$previous..}${GITHUB_REF_NAME}"
          section() {
            lines=$(git log --no-merges --reverse --format='%s' "$range" \
              | grep -E "^$1(\([^)]*\))?!?: " \
              | sed -E "s/^$1\(([^)]*)\)!?: /- \1: /; s/^$1!?: /- /" || true)
            if [ -n "$lines" ]; then
              printf '## %s\n\n%s\n\n' "$2" "$lines"
            fi
          }
          {
            section feat "New stuff"
            section fix "Fixes"
            section perf "Faster"
          } > notes.md
          cat notes.md

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # the updater refuses archives without a signature from this key, see RELEASE_KEY
      - name: Sign archives
        shell: bash
        env:
          MINISIGN_KEY: ${{ secrets.MINISIGN_KEY }}
        run: |
          if [ -z "$MINISIGN_KEY" ]; then
            echo "the MINISIGN_KEY secret is missing, refusing to publish unsigned archives"
            exit 1
          fi
          sudo apt-get update && sudo apt-get install -y minisign
          key=$(mktemp)
          printf '%s\n' "$MINISIGN_KEY" > "$key"
          for archive in dist/*.zip dist/*.tar.gz; do
            [ -e "$archive" ] || continue
            name=$(basename "$archive")
            minisign -S -s "$key" -m "$archive" -t "timestamp:$(date +%s) file:$name" < /dev/null
          done
          rm -f "$key"
          ls dist

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: notes.md
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
