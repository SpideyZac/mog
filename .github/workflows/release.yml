name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

# third party actions are pinned to a commit, the comment says which release it is
jobs:
  # a tag only ships if formatting, lints, tests, the minimum rust version and cargo deny pass
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build:
    name: build ${{ matrix.target }}
    needs: ci
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config

      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --bin mog --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          name="mog-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir "$name"
          cp README.md LICENSE "$name/"
          cp -r examples "$name/"
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp "target/${{ matrix.target }}/release/mog.exe" "$name/"
            7z a "$name.zip" "$name" > /dev/null
            archive="$name.zip"
          else
            cp "target/${{ matrix.target }}/release/mog" "$name/"
            tar czf "$name.tar.gz" "$name"
            archive="$name.tar.gz"
          fi
          if command -v sha256sum > /dev/null; then
            sha256sum "$archive" > "$archive.sha256"
          else
            shasum -a 256 "$archive" > "$archive.sha256"
          fi
          echo "ARCHIVE=$archive" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.target }}
          path: |
            ${{ env.ARCHIVE }}
            ${{ env.ARCHIVE }}.sha256

  # every platform has to build, a partial release would break the updater and binstall for the
  # missing ones
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      # mog shows these in its what's new popup, so list the commits since the last tag
      - name: Write release notes
        shell: bash
        run: |
          previous=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          range="${previous:+$previous..}${GITHUB_REF_NAME}"
          section() {
            lines=$(git log --no-merges --reverse --format='%s' "$range" \
              | grep -E "^$1(\([^)]*\))?!?: " \
              | sed -E "s/^$1\(([^)]*)\)!?: /- \1: /; s/^$1!?: /- /" || true)
            if [ -n "$lines" ]; then
              printf '## %s\n\n%s\n\n' "$2" "$lines"
            fi
          }
          {
            section feat "New stuff"
            section fix "Fixes"
            section perf "Faster"
          } > notes.md
          cat notes.md

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true

      - name: Check every platform is there
        shell: bash
        run: |
          for target in x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu x86_64-apple-darwin \
            aarch64-apple-darwin x86_64-pc-windows-msvc; do
            archive=$(ls dist/mog-"${GITHUB_REF_NAME}-${target}".* 2>/dev/null | grep -v '\.sha256$' || true)
            if [ -z "$archive" ] || [ ! -f "$archive.sha256" ]; then
              echo "the build for $target is missing, not releasing"
              exit 1
            fi
          done

      # the updater refuses archives without a signature from this key, see RELEASE_KEY
      - name: Sign archives
        shell: bash
        env:
          MINISIGN_KEY: ${{ secrets.MINISIGN_KEY }}
        run: |
          if [ -z "$MINISIGN_KEY" ]; then
            echo "the MINISIGN_KEY secret is missing, refusing to publish unsigned archives"
            exit 1
          fi
          sudo apt-get update && sudo apt-get install -y minisign
          key=$(mktemp)
          printf '%s\n' "$MINISIGN_KEY" > "$key"
          for archive in dist/*.zip dist/*.tar.gz; do
            [ -e "$archive" ] || continue
            name=$(basename "$archive")
            minisign -S -s "$key" -m "$archive" -t "timestamp:$(date +%s) file:$name" < /dev/null
            # cargo-binstall looks for the signature at <archive>.sig
            cp "$archive.minisig" "$archive.sig"
          done
          rm -f "$key"
          ls dist

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: dist/*
          body_path: notes.md
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}

  # renders the homebrew formula, the aur PKGBUILD and the winget manifests, attaches them to the
  # release and publishes each one whose secret is set, see packaging/README.md
  packages:
    needs: release
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    env:
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
      WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true

      - name: Render packages
        run: bash packaging/render.sh "${GITHUB_REF_NAME#v}" dist packages

      - name: Attach them to the release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            packages/homebrew/mog.rb
            packages/aur/PKGBUILD
            packages/winget/*.yaml

      - name: Update the Homebrew tap
        if: env.HOMEBREW_TAP_TOKEN != ''
        shell: bash
        run: |
          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/SpideyZac/homebrew-mog.git" tap
          mkdir -p tap/Formula
          cp packages/homebrew/mog.rb tap/Formula/mog.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/mog.rb
          git commit -m "mog ${GITHUB_REF_NAME}" || exit 0
          git push

      - name: Update the AUR package
        if: env.AUR_SSH_PRIVATE_KEY != ''
        uses: KSXGitHub/github-actions-deploy-aur@084b0d9b15415bf9cdb65d44dad1efe37a354050 # v4.2.0
        with:
          pkgname: mog-bin
          pkgbuild: packages/aur/PKGBUILD
          commit_username: ${{ vars.AUR_USERNAME || 'SpideyZac' }}
          commit_email: ${{ vars.AUR_EMAIL || 'mog@users.noreply.github.com' }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: mog ${{ github.ref_name }}

      - name: Open a winget pull request
        if: env.WINGET_TOKEN != ''
        uses: vedantmgoyal9/winget-releaser@4ffc7888bffd451b357355dc214d43bb9f23917e # v2
        with:
          identifier: SpideyZac.mog
          installers-regex: 'x86_64-pc-windows-msvc\.zip$'
          token: ${{ secrets.WINGET_TOKEN }}
