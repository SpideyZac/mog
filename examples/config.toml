# Example mog config. Put it at <config dir>/mog/config.toml.
# Every setting is optional.

[editor]
tab_width = 4
insert_spaces = true
auto_close_brackets = true
auto_complete = true

[ui]
# themes: mog, synthwave, matrix, sunset, ocean, forest, paper
theme = "mog"
tabs = true
line_numbers = true
relative_line_numbers = false
cursor_line = true
indent_guides = true
rainbow_brackets = true
syntax_highlighting = true
minimap = true
error_lens = true
git_gutter = true
git_blame = true
explorer = true
icons = true

[keys]
# chord = command name, or "" to remove a default binding
"ctrl+d" = "select_all"
"alt+w" = "hello.wave"

[flair]
enabled = true
disabled = []

# built in servers: rust, python, typescript, go, c, lua
[lsp.zig]
command = "zls"
extensions = ["zig"]

[lsp.go]
enabled = false

[ai]
ghost_text = true

[ai.claude]
enabled = false
model = "claude-opus-5-5"
api_key_env = "ANTHROPIC_API_KEY"

[ai.copilot]
enabled = false

[audio]
sound_effects = false
music = false
volume = 50
