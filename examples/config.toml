# Example mog config. Put it at <config dir>/mog/config.toml.
# Every setting is optional.

[editor]
tab_width = 4
insert_spaces = true

[keys]
# chord = command name, or "" to remove a default binding
"ctrl+d" = "select_all"
"alt+w" = "hello.wave"

[flair]
enabled = true
disabled = []

# built in servers: rust, python, typescript, go, c, lua
[lsp.zig]
command = "zls"
extensions = ["zig"]

[lsp.go]
enabled = false

[ai.claude]
enabled = false
model = "claude-opus-5-5"
api_key_env = "ANTHROPIC_API_KEY"

[ai.copilot]
enabled = false
