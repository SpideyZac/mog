# Example mog config. Put it at <config dir>/mog/config.toml.
# Every setting is optional.

[editor]
tab_width = 4
insert_spaces = true
auto_close_brackets = true
auto_complete = true
# milliseconds of no typing before language servers check the file for errors
diagnostics_delay = 500
# symbols typed with altgr, like { on qwertz, type text instead of running ctrl+alt shortcuts
alt_gr = true

[ui]
# themes: mog, synthwave, matrix, sunset, ocean, forest, paper
theme = "mog"
tabs = true
line_numbers = true
relative_line_numbers = false
cursor_line = true
indent_guides = true
rainbow_brackets = true
syntax_highlighting = true
minimap = true
error_lens = true
git_gutter = true
git_blame = true
explorer = true
icons = true
# 0 to 100, below 100 a see through terminal shows through
opacity = 100

[keys]
# chord = command name, or "" to remove a default binding
"ctrl+d" = "select_all"
"alt+w" = "hello.wave"

[flair]
enabled = true
disabled = []

# built in servers: rust, python, typescript, go, c, lua, zig, java, csharp, kotlin, swift,
# ruby, php, scala, haskell, ocaml, elixir, dart, bash, html, css, json, yaml, toml, markdown, vue
# settings go to the server itself, for example
# [lsp.rust.settings]
# check.command = "clippy"
[lsp.nim]
command = "nimlangserver"
extensions = ["nim"]

[lsp.go]
enabled = false

[ai]
ghost_text = true

[ai.claude]
enabled = false
# turn single features off per provider
chat = true
ghost_text = true
model = "claude-opus-5-5"
api_key_env = "ANTHROPIC_API_KEY"

[ai.copilot]
enabled = false
chat = true
ghost_text = true
# install with: npm i -g @github/copilot-language-server
command = "copilot-language-server"
args = ["--stdio"]

[audio]
sound_effects = false
music = false
volume = 50

[terminal]
# empty picks powershell on windows and $SHELL elsewhere
shell = ""
args = []

[discord]
enabled = false
# the official mog app, or make your own at https://discord.com/developers/applications
client_id = "1556366148948459571"
large_image = "mog"
show_file = true

# custom themes start from a built in one and change any of its colors. pick them with
# ui.theme, or make one with Theme: Edit colors from the command palette.
# colors: bg panel raised select fg dim accent accent2 red orange yellow green cyan blue purple pink
[themes.midnight]
base = "ocean"
accent = "#ff5ccd"
bg = "#070b14"

[updates]
# look for a new release on github when mog starts
check = true
# download and install it by itself, ready the next time mog starts
install = true
