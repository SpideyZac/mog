[package]
name = "mog"
description = "A terminal code editor that mogs other editors."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

# lets `cargo binstall` grab a release build instead of compiling
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/mog-v{ version }-{ target }.tar.gz"
bin-dir = "mog-v{ version }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/v{ version }/mog-v{ version }-{ target }.zip"
pkg-fmt = "zip"

[package.metadata.binstall.signing]
algorithm = "minisign"
pubkey = "RWQEyQrj2l2VtRVkLbwHBkVxhMbDdbOGc7wHR8hjR27Ry+epMjmzedE0"

[dependencies]
anyhow.workspace = true
arboard.workspace = true
clap.workspace = true
mog-ai.workspace = true
mog-audio.workspace = true
lsp-types.workspace = true
minisign-verify.workspace = true
mog-config.workspace = true
crossterm.workspace = true
discord-rich-presence.workspace = true
futures.workspace = true
mog-core.workspace = true
mog-dap.workspace = true
mog-flair.workspace = true
mog-git.workspace = true
mog-lsp.workspace = true
mog-plugin.workspace = true
mog-term.workspace = true
mog-tui.workspace = true
notify.workspace = true
open.workspace = true
ratatui.workspace = true
reqwest.workspace = true
self-replace.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sysinfo.workspace = true
tokio.workspace = true

[target.'cfg(windows)'.dependencies]
zip.workspace = true

[target.'cfg(not(windows))'.dependencies]
flate2.workspace = true
tar.workspace = true
